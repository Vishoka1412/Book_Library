services:
  - type: web
    name: lumina-book-library
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: auto
      # Uncomment if using Render PostgreSQL database:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: lumina-db
      #     property: connectionString

# Optional: Render PostgreSQL Database instance (Free Tier)
# databases:
#   - name: lumina-db
#     plan: free
#     databaseName: book_library
#     user: postgres
